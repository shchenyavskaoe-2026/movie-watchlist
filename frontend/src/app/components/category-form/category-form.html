<form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label>Category Name *</label>
    <input formControlName="name" placeholder="Enter category name">
    @if (categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched) {
      <span class="error">Name is required (max 100 chars)</span>
    }
  </div>

  <button type="submit" [disabled]="categoryForm.invalid">Save Category</button>
</form>
